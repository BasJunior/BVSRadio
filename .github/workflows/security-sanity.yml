name: Security sanity checks

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate package manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('frontend/package.json','utf8'))"

      - name: Check backend JavaScript syntax
        run: find backend -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Check Next.js configuration syntax
        run: node --check frontend/next.config.js

      - name: Prevent insecure identity-header bypass from returning
        run: |
          if grep -R -n --include='*.js' 'x-user-id' backend; then
            echo 'Insecure x-user-id identity bypass found in backend JavaScript.' >&2
            exit 1
          fi
